          - large
          - small
          type: object
          description: Thumbnails for displaying the room in various sizes.
        privacySettings:
          $ref: '#/components/schemas/ApiResponseRoomPrivacySettings'
          description: The privacy settings for this room.
        userRoles:
          properties: {}
