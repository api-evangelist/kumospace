                isOverlay:
                  type: boolean
                isSynced:
                  type: boolean
                initialTime:
                  type: number
                  format: double
                textSize:
                  type: number
                  format: double
                left:
                  type: number
                  format: double
                top:
                  type: number
                  format: double
              required:
              - chimeOnEnd
              - isSynced
              - initialTime
              - textSize
              - left
              - top
              type: object
            - properties:
