          type:
            $ref: '#/components/schemas/FurnitureBehaviorType.soundEffect'
        required:
        - data
        - type
        type: object
      - properties:
          data:
            properties:
              url:
                type: string
            required:
            - url
            type: object
          type:
            $ref: '#/components/schemas/FurnitureBehaviorType.horsepaste'
        required:
        - data
        - type
        type: object
      - properties:
          type:
            $ref: '#/components/schemas/FurnitureBehaviorType.chess'
        required:
        - type
        type: object
      - properties:
          data:
            properties:
              width:
                type: number
                format: double
              height:
                type: number
                format: double
              left:
