        - type
        type: object
      - properties:
          type:
            $ref: '#/components/schemas/FurnitureBehaviorType.broadcast'
        required:
        - type
        type: object
      - properties:
          data:
            allOf:
            - properties:
                text:
                  type: string
                magnification:
                  $ref: '#/components/schemas/Dimensions'
              required:
              - text
              - magnification
              type: object
            - $ref: '#/components/schemas/Dimensions'
          type:
            $ref: '#/components/schemas/FurnitureBehaviorType.stickyNote'
        required:
        - data
        - type
        type: object
      - properties:
          data:
            anyOf:
            - $ref: '#/components/schemas/Record_string.never_'
            - properties:
                gameId:
                  type: string
                puzzle:
                  $ref: '#/components/schemas/CrosswordPuzzle'
              required:
              - gameId
              - puzzle
              type: object
          type:
            $ref: '#/components/schemas/FurnitureBehaviorType.crossword'
        required:
        - data
        - type
        type: object
      - properties:
          data:
            anyOf:
            - $ref: '#/components/schemas/Record_string.never_'
            - properties:
                tutorial:
                  type: string
              required:
              - tutorial
              type: object
          type:
            $ref: '#/components/schemas/FurnitureBehaviorType.kiosk'
        required:
        - data
        - type
        type: object
      - properties:
          data:
            properties:
              openInNewTab:
