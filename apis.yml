aid: kumospace
name: Kumospace
description: Kumospace is a virtual office platform for remote and distributed teams, providing a persistent
  spatial workspace where colleagues move between rooms and floors, with proximity-based spatial audio and
  video, team chat channels, scheduled and ad-hoc meetings, recordings, transcription and meeting summaries,
  and calendar integrations with Google Calendar and Microsoft Outlook. Spaces are visually customizable
  through rooms, zones, floors, walls, furniture and music tracks, and the platform integrates presence
  status with Zoom and Microsoft Teams. Kumospace operates a publicly reachable REST API at
  api.kumospace.com, documented with a Swagger UI and an OpenAPI 3.0 description covering spaces, rooms,
  zones, users, invitations, chat, calendar, recordings, transcription, analytics and payments. The company
  is headquartered in New York and is backed by Lightspeed Venture Partners.
